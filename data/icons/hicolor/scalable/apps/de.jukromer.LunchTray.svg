  <ellipse cx="50" cy="65" rx="25" ry="20" fill="#ffffff"/>
  <ellipse cx="50" cy="65" rx="17" ry="13" fill="#f6f5f4" stroke="#deddda" stroke-width="2"/>
  <ellipse cx="46" cy="63" rx="7" ry="4" fill="#33d17a" transform="rotate(-25 46 63)"/>
  <circle cx="55" cy="67" r="4.5" fill="#ed333b"/>

