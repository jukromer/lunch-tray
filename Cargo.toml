[package]
name = "lunch-tray"
version = "0.1.0"
edition = "2024"
description = "See what's on the menu at your canteen"
license = "GPL-3.0-or-later"
repository = "https://github.com/jukromer/lunch-tray"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_50"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
